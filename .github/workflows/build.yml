name: Build TM Proxy

on:
  push:
    paths:
      - 'rs-apk-src.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          unzip -o -q rs-apk-src.zip -d "$RUNNER_TEMP/src"
          echo "SRC=$RUNNER_TEMP/src" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Go برای ساخت موتورهای تونل DNS و thefeed از سورس اصلی‌شان
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      # نسخهٔ github = APK برای نصب مستقیم · نسخهٔ play = AAB برای گوگل پلی (هر دو با کد مبهم R8)
      - name: Build (obfuscated release)
        run: cd "$SRC" && gradle assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$SRC/app/build/outputs/apk/github/release/app-github-release.apk" TM-Proxy.apk
          cp "$SRC/app/build/outputs/bundle/playRelease/app-play-release.aab" TM-Proxy-play.aab
          gh release create "v${{ github.run_number }}" TM-Proxy.apk TM-Proxy-play.aab \
            --title "TM Proxy v${{ github.run_number }}" \
            --notes "Made by Reza (R.S) · فایل TM-Proxy.apk را دانلود و نصب کن. فایل TM-Proxy-play.aab برای گوگل پلی است." \
            --repo "${{ github.repository }}"

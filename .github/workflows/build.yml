name: Build TM Proxy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir -p src
          if [ -f rs-apk-src.zip ]; then
            unzip -o -q rs-apk-src.zip -d src
          else
            cp -r app settings.gradle build.gradle gradle.properties src/
          fi
          ls -R src | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk TM-Proxy.apk
          gh release create "v${{ github.run_number }}" TM-Proxy.apk \
            --title "TM Proxy v${{ github.run_number }}" \
            --notes "Made by Reza (R.S) - download TM-Proxy.apk and install." \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TM-Proxy-apk
          path: TM-Proxy.apk
